[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "maze"
version = "0.1.0"
description = "可打印迷宫生成器：完美迷宫、入口出口与答案通路"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "eastyou" }]
keywords = ["education", "puzzle", "maze", "worksheet", "print", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Education",
]

[project.scripts]
maze = "maze.cli:main"

[project.urls]
Homepage = "https://github.com/eastyou/maze"
Source = "https://github.com/eastyou/maze"

[tool.setuptools]
packages = ["maze"]
